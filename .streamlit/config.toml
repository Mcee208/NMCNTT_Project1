# Đặt file này ở: .streamlit/config.toml  (commit lên GitHub – file này KHÔNG chứa khóa bí mật)
[theme]
base = "dark"
primaryColor = "#4cc9f0"
backgroundColor = "#05080f"
secondaryBackgroundColor = "#111d3f"
textColor = "#f1f5ff"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
